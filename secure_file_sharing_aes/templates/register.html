{% extends 'base.html' %}{% block content %}<section class="auth card"><div class="eyebrow">CREATE ACCOUNT</div><h1>Join CipherShare</h1><p class="muted">Your uploads are encrypted before being saved.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Username<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_]+" autocomplete="username" required></label><label>Password (minimum 12 characters)<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><button class="button" type="submit">Create account</button></form><p class="fineprint">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
